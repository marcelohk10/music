    const params = new URLSearchParams(window.location.search);

    // Mantém acentos no nome exibido e também aceita links antigos que tenham
    // sido codificados duas vezes (por exemplo, "Calor%25C3%25AA").
    function normalizeUrlText(value) {
        if (!value) return '';
        let normalized = value;
        if (/%[0-9a-f]{2}/i.test(normalized)) {
            try { normalized = decodeURIComponent(normalized); } catch (e) {}
        }
        return normalized.normalize('NFC').replace(/[\u0000-\u001F\u007F]/g, '').trim();
    }

    // Algumas plataformas não encontram títulos acentuados. Essa versão é
    // usada somente como segunda tentativa; o título público continua "Calorê".
    function withoutAccents(value) {
        return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    const artistaUrl = normalizeUrlText(params.get('artista'));
    const musicaUrl = normalizeUrlText(params.get('musica'));
    const artworkUrl = params.get('artwork_url');
    const tiktokUrl = params.get('tiktok_url');
    const instagramUrl = params.get('ig_url');
    const youtubeIdParam = params.get('youtube_id');
    const youtubeUrlParam = params.get('youtube_url');
    const soundcloudUrlParam = params.get('soundcloud_url');

    const knownReleases = {

            youtubeId: 'dCD8mVvLs9w',

    function trackEvent(eventName, params = {}) {
        if (typeof gtag === 'function') {
            gtag('event', eventName, { ...params, transport: 'beacon' });
        }
        if (typeof ttq !== 'undefined' && ttq.track) {
            ttq.track(eventName, params);
        }
        if (typeof fbq === 'function') {
            fbq('trackCustom', eventName, params);
        }
    }

    function openTrackedLink(url, eventName, extraParams = {}) {
        let newWindow = null;
        try {
            newWindow = window.open(url, '_blank', 'noopener,noreferrer');
        } catch (e) {}
        if (!newWindow) {
            setTimeout(() => window.open(url, '_blank', 'noopener,noreferrer'), 100);
        }
        trackEvent(eventName, {
            ...extraParams,
            destination_url: url,
            musica: currentSong || songInput.value || '',
            artista: currentArtist || artistInput.value || '',
            source: 'manual'
        });
    }

        if (twDesc) twDesc.setAttribute('content', description || 'Ouça agora');
        if (twImage && image) twImage.setAttribute('content', image);

    function extractYouTubeId(input) {
        if (!input) return '';
        if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
        try {
            const url = new URL(input);
            if (url.hostname.includes('youtu.be')) return url.pathname.replace('/', '').trim();
            const v = url.searchParams.get('v');
            if (v) return v;
            const match = url.pathname.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
            if (match) return match[1];
        } catch (e) {}
        return '';
    }

    const STREAMING_PREFERENCE_KEY = 'preferredStreaming';

    function getPreferredStreaming() {
        try {
            const saved = JSON.parse(localStorage.getItem(STREAMING_PREFERENCE_KEY) || 'null');
            if (!saved || !saved.name || Date.now() - saved.savedAt > STREAMING_PREFERENCE_TTL) {
                localStorage.removeItem(STREAMING_PREFERENCE_KEY);
                return '';
            }
            return saved.name;
        } catch (e) { return ''; }
    }

    function markPreferredPlatform(name) {
        document.querySelectorAll('.platform-btn').forEach(button => {
            const selected = button.dataset.platform === name;
            button.classList.toggle('preferred', selected);
            const label = button.querySelector('.platform-name');
            const currentBadge = label && label.querySelector('.preference-badge');
            if (selected && label && !currentBadge) {
                const badge = document.createElement('span');
                badge.className = 'preference-badge';
                badge.textContent = 'Sua preferência';
                label.appendChild(badge);
            } else if (!selected && currentBadge) {
                currentBadge.remove();
            }
        });
    }

    function rememberPreferredStreaming(name) {
        try {
            localStorage.setItem(STREAMING_PREFERENCE_KEY, JSON.stringify({ name, savedAt: Date.now() }));
        } catch (e) {}
        markPreferredPlatform(name);

    // ========================================================================
    //  BUSCA PRINCIPAL
    // ========================================================================
    async function searchMusic() {
        const artist = artistInput.value.trim() || currentArtist;
        const song = songInput.value.trim() || currentSong;
        if (!artist || !song) {
            alert('Preencha o artista e a música.');
            return;
        }

        currentArtist = artist;
        currentSong = song;
        const knownRelease = getKnownRelease(artist, song);
        loading.style.display = 'block';
        resultsContainer.style.display = 'none';
        linksContainer.innerHTML = '';
        socialBtns.innerHTML = '';
        artwork.style.display = 'none';
        previewBtn.style.display = 'none';
        previewBtn.classList.remove('is-playing');
        if (previewAudio) { previewAudio.pause(); previewAudio = null; }
        currentPreviewUrl = '';

        if (knownRelease && knownRelease.artwork) {
            showArtwork(knownRelease.artwork);
            updateMetaTags(song, `${artist} - Ouça agora`, knownRelease.artwork);
        }

        const query = `${artist} ${song}`.normalize('NFC');
        const fallbackQuery = withoutAccents(query);
        trackEvent('search_submitted', { artista: artist, musica: song, query });

        // 1. iTunes
        let appleButtonAdded = false;
        try {
            let data = knownRelease && knownRelease.appleCollectionId
                ? await lookupItunes(knownRelease.appleCollectionId)
                : await searchItunes(query);
            if ((!data.results || !data.results.length) && fallbackQuery !== query) {
                data = await searchItunes(fallbackQuery);
            }
            if (data.results && data.results.length) {
                const track = data.results.find(item => item.wrapperType === 'track') || data.results[0];
                if (track.artworkUrl100) {
                    showArtwork(track.artworkUrl100.replace('100x100', '300x300'));
                    updateMetaTags(track.trackName, `${track.artistName} - Ouça agora`, artwork.src);
                }
                songTitle.textContent = track.trackName || song;
                songArtist.textContent = track.artistName || artist;
                currentPreviewUrl = track.previewUrl || '';
                if (currentPreviewUrl) {
                    previewBtn.style.display = 'block';
                    previewBtn.textContent = '▶ Ouvir prévia';
                }
                const appleUrl = track.trackViewUrl || (knownRelease && knownRelease.appleMusic);
                if (appleUrl) {
                    createPlatformButton('Apple Music', appleUrl, 'appleMusic');
                    appleButtonAdded = true;
                }
            } else {
                songTitle.textContent = song;
                songArtist.textContent = artist;
                updateMetaTags(song, artist, artworkUrl || '');
            }
        } catch (e) {
            console.warn('iTunes error:', e);
            songTitle.textContent = song;
            songArtist.textContent = artist;
        }

        if (!appleButtonAdded && knownRelease && knownRelease.appleMusic) {
            createPlatformButton('Apple Music', knownRelease.appleMusic, 'appleMusic');
        }

        if (!artwork.style.display || artwork.style.display === 'none') {
            if (artworkUrl) {
                showArtwork(artworkUrl);
            }
        }

        // 2. Deezer
        try {
            let deezerData = await searchDeezer(query);
            if (!deezerData && fallbackQuery !== query) {
                deezerData = await searchDeezer(fallbackQuery);
            }
            if (deezerData) {
                if ((!artwork.style.display || artwork.style.display === 'none') && deezerData.album) {
                    showArtwork(deezerData.album.cover_big || deezerData.album.cover_medium);
                    updateMetaTags(song, `${artist} - Ouça agora`, artwork.src);
                }
                if (!currentPreviewUrl && deezerData.preview) {
                    currentPreviewUrl = deezerData.preview;
                    previewBtn.style.display = 'block';
                    previewBtn.textContent = '▶ Ouvir prévia';
                }
                createPlatformButton('Deezer', deezerData.link, 'deezer');
            }
        } catch (e) { console.warn('Deezer error:', e); }

        if (!artwork.style.display || artwork.style.display === 'none') {
            showArtwork('');
            updateMetaTags(song, `${artist} - Ouça agora`, artwork.src);
        }

        // 3. Plataformas fixas
        const platforms = [
            { name: 'Spotify', url: `https://open.spotify.com/search/${encodeURIComponent(query)}`, cls: 'spotify' },
            { name: 'YouTube Music', url: (knownRelease && knownRelease.youtubeMusic) || `https://music.youtube.com/search?q=${encodeURIComponent(query)}`, cls: 'youtubeMusic' },
            { name: 'TikTok Music', url: `https://www.tiktok.com/search/music?q=${encodeURIComponent(query)}`, cls: 'tiktokMusic' },
            { name: 'Amazon Music', url: `https://music.amazon.com.br/search/${encodeURIComponent(query)}`, cls: 'amazonMusic' },
            { name: 'SoundCloud', url: `https://soundcloud.com/search/sounds?q=${encodeURIComponent(query)}`, cls: 'soundCloud' },
            { name: 'Tidal', url: `https://listen.tidal.com/search?q=${encodeURIComponent(query)}`, cls: 'tidal' }
        ];
        platforms.forEach(p => createPlatformButton(p.name, p.url, p.cls));

        // 4. Links sociais
        let hasSocial = false;
        if (tiktokUrl) { createSocialButton('🎵 Usar Som no TikTok', tiktokUrl, 'tiktok'); hasSocial = true; }
        if (instagramUrl) { createSocialButton('📸 Usar Som no Instagram', instagramUrl, 'instagram'); hasSocial = true; }
        socialLinksContainer.style.display = hasSocial ? 'block' : 'none';

        // 5. Compartilhar
        if (navigator.share) {
            shareBtn.style.display = 'block';
            shareBtn.textContent = '📤 Compartilhar link';
            shareBtn.onclick = () => {
                navigator.share({
                    title: songTitle.textContent || 'Música',
                    text: getShareText(),
                    url: getShareUrl()
                }).then(() => trackEvent('click_share', { link_tipo: 'Compartilhar nativo', musica: currentSong }));
            };
        } else if (navigator.clipboard) {
            shareBtn.style.display = 'block';
            shareBtn.textContent = '📋 Copiar link';
            shareBtn.onclick = () => {
                navigator.clipboard.writeText(getShareUrl()).then(() => {
                    shareBtn.textContent = '✅ Copiado!';
                    setTimeout(() => shareBtn.textContent = '📋 Copiar link', 2000);
                    trackEvent('click_share', { link_tipo: 'Copiar link (desktop)', musica: currentSong });
                });
            };
        }

        // 6. Prévia
        previewBtn.onclick = () => {
            if (!currentPreviewUrl) return;
            if (!previewAudio) {
                previewAudio = new Audio(currentPreviewUrl);
                previewAudio.onended = () => {
                    previewBtn.textContent = '▶ Ouvir prévia';
                    previewBtn.classList.remove('is-playing');
                };
            }
            if (previewAudio.paused) {
                previewAudio.play().then(() => {
                    previewBtn.textContent = '⏸ Pausar';
                    previewBtn.classList.add('is-playing');
                    trackEvent('click_preview', { musica: currentSong, link_tipo: 'Preview iTunes' });
                }).catch(() => {});
            } else {
                previewAudio.pause();
                previewBtn.textContent = '▶ Ouvir prévia';
                previewBtn.classList.remove('is-playing');
            }
        };

        setupQuickShare();
        renderEmbeds(knownRelease);

        resultsContainer.style.display = 'block';
        loading.style.display = 'none';
        trackEvent('results_rendered', { musica: currentSong, artista: currentArtist });
    }

    // ----- ITUNES E DEEZER (JSONP: funciona também no HTML local) -----
    function searchItunes(query) {
        return new Promise((resolve) => {
            const callback = 'itunesCb' + Date.now();
            const script = document.createElement('script');
            let finished = false;

            function finish(data) {
                if (finished) return;
                finished = true;
                try { document.body.removeChild(script); } catch(e) {}
                delete window[callback];
                resolve(data || { results: [] });
            }

            window[callback] = finish;
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1&country=BR&callback=${callback}`;
            script.onerror = () => finish({ results: [] });
            document.body.appendChild(script);
            setTimeout(() => finish({ results: [] }), 5000);
        });
    }

    function lookupItunes(collectionId) {
        return new Promise((resolve) => {
            const callback = 'itunesLookupCb' + Date.now();
            const script = document.createElement('script');
            let finished = false;

            function finish(data) {
                if (finished) return;
                finished = true;
                try { document.body.removeChild(script); } catch(e) {}
                delete window[callback];
                resolve(data || { results: [] });
            }

            window[callback] = finish;
            script.src = `https://itunes.apple.com/lookup?id=${encodeURIComponent(collectionId)}&entity=song&country=BR&callback=${callback}`;
            script.onerror = () => finish({ results: [] });
            document.body.appendChild(script);
            setTimeout(() => finish({ results: [] }), 5000);
        });
    }

    function searchDeezer(query) {
        return new Promise((resolve, reject) => {
            const callback = 'deezerCb' + Date.now();
            const script = document.createElement('script');
            window[callback] = function(data) {
                try { document.body.removeChild(script); } catch(e) {}
                delete window[callback];
                if (data && data.data && data.data.length) resolve(data.data[0]);
                else resolve(null);
            };
            script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp&callback=${callback}`;
            script.onerror = () => { reject(new Error('Deezer fail')); };
            document.body.appendChild(script);
            setTimeout(() => {
                if (window[callback]) {
                    try { document.body.removeChild(script); } catch(e) {}
                    delete window[callback];
                    resolve(null);
                }
            }, 4000);
        });
    }

    // ========================================================================
    //  CARREGAMENTO INICIAL
    // ========================================================================
    window.addEventListener('load', () => {
        // Renderiza álbuns fixos
        renderAlbums();

        if (artistaUrl && musicaUrl) {
            artistInput.value = artistaUrl;
            songInput.value = musicaUrl;
            currentArtist = artistaUrl;
            currentSong = musicaUrl;
            document.getElementById('search-box').style.display = 'none';
            searchMusic();
        } else {
            updateMetaTags('🎵 Marcelo Hacker', 'Ouça minhas músicas em todas as plataformas.', '');
        }

        searchBtn.addEventListener('click', searchMusic);
        artistInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchMusic(); });
        songInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchMusic(); });
    });
</script>
